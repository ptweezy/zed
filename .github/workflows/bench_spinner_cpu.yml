name: bench_spinner_cpu
on:
  push:
    branches: [bench-spinner-max-fps]
  workflow_dispatch:
    inputs:
      runs:
        default: "11"
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: ./script/linux
      - name: CPU info
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | head -20 ;;
            macOS) sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize ;;
            Windows) powershell -c "Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed" ;;
          esac
      - name: Build
        run: bench/spinner_cpu/build.sh
      - name: Measure
        run: |
          python3 bench/spinner_cpu/measure.py ${{ inputs.runs || 11 }} | tee results.md
          cat results.md >> "$GITHUB_STEP_SUMMARY"
