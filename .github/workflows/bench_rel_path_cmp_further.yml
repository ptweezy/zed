name: Measure RelPath::cmp variants
on:
  push:
    branches:
      - bench-relpath-cmp-further
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bench/rel_path_cmp_further
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # Outside the checkout, so the repository's .cargo/config.toml doesn't apply.
          cp -r bench/rel_path_cmp_further/cmpbench "$RUNNER_TEMP/cmpbench"
          cd "$RUNNER_TEMP/cmpbench"
          cargo build --release
          rustc --version
      - name: List paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lists" "$RUNNER_TEMP/clones"
          for url in https://github.com/zed-industries/zed https://github.com/torvalds/linux https://github.com/mozilla-firefox/firefox; do
            name=$(basename "$url")
            clone="$RUNNER_TEMP/clones/$name"
            git clone --quiet --depth 1 --filter=blob:none --no-checkout "$url" "$clone"
            git -C "$clone" -c core.quotePath=false ls-tree -r -t --name-only HEAD > "$RUNNER_TEMP/lists/$name.txt"
            echo "$name: $(git -C "$clone" rev-parse --short HEAD), $(wc -l < "$RUNNER_TEMP/lists/$name.txt") paths"
          done
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          python=$(command -v python3 || command -v python)
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          variants=pr,xor_d,mask_d,base
          if [ "$RUNNER_ARCH" = X64 ]; then variants=$variants,sse2; fi
          "$python" bench/rel_path_cmp_further/measure_replay.py "$RUNNER_TEMP/cmpbench/target/release/cmpbench$suffix" "$GITHUB_STEP_SUMMARY" 7 bench/rel_path_cmp_further/data "$RUNNER_TEMP/lists" "$variants"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-${{ matrix.os }}
          path: results.tsv
          if-no-files-found: ignore
